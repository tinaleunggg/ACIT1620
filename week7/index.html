<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background: lightblue;
            transform: rotateY(45deg);
            transition: transform 0.5s ease; 
        }

        .box:hover {
            transform: rotateY(180deg);
        }

        .container {
            perspective:1000px;
        }


        .card{
            width: 200px;
            height: 300px;
            perspective: 1000px;
        }
        .card-inner{
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s
        }

        .card:hover .card-front{
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back{
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid black;
        
        }

        .card-front{
            background: lightblue;
        }

        .card-back{
            background: coral;
            transform: rotateY(180deg);
        }



    </style>
</head>
<body>
    <div class="container">
    <div class="box">3D box</div>
    </div>

    <div class="card">
        <div class="card-front">front</div>
        <div class="card-back">back</div>
    </div>

</body>
</html>
