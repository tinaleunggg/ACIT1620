<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .redtext{
            color: red;
        }
    </style>
</head>
<body>
    <!--
        <script src="dom.js"></script> will not work, js executed before the p loaded
    -->
    <p id="code9">My watch stopped at </p>



    <p id="greenplanet">all is well </p>

    <script>
        function init(){   // by convention to name function that perform initialization
            let planet = document.getElementById("greenplanet");
            planet.innerHTML = "get hit by phaser fire!";
            planet.setAttribute("class", "redtext");
        }
        window.onload = init;   // assigning function value of onload property, not calling the function
    </script>

    
    <p class="highlight"> p1 </p>
    <p class="highlight"> p2 </p>
    <p class="highlight"> p3 </p>

    <button onclick="changeColor()">change color</button>
    <button onclick="changeFontSize()">change font size</button>
    <button onclick="changeText()">change text</button>
    <button onclick="changeColors()">change colors</button>
    

    <script src="dom.js"></script> <!--  DOM should be put after the content -->


</body>
</html>
